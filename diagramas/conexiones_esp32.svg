<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<rect width="1100" height="720" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="27" font-weight="bold">Mini-invernadero: dos sensores y riego por gravedad</text>
